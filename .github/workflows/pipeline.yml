name: Crypto Pipeline Hourly

on:
  schedule:
    - cron: '0 * * * *'  # Se ejecuta cada 1 hora automáticamente
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub cuando quieras

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python crypto_pipeline.py